<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a4f42"><title>Surgical Ward AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f6f5;color:#182b38;padding-bottom:30px}.top{background:#0a4f42;color:#fff;padding:16px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:20px}.top p{margin:4px 0 0;font-size:12px;opacity:.8}.wrap{max-width:900px;margin:auto;padding:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid #dbe2e8;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat small{color:#667;font-size:11px}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar button,.primary{border:0;border-radius:10px;padding:10px 14px;background:#0f6e5c;color:#fff;font-weight:700}.toolbar button.secondary{background:#fff;color:#0f6e5c;border:1px solid #cbd8d5}.cards{display:grid;grid-template-columns:1fr;gap:9px}.card{background:#fff;border:1px solid #dbe2e8;border-left:5px solid #16a34a;border-radius:14px;padding:12px;box-shadow:0 1px 2px #0000000d}.card.urgent{border-left-color:#ea580c}.card.critical{border-left-color:#dc2626}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.muted{font-size:12px;color:#667}.diag{margin:6px 0;font-size:14px}.badge{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:800;background:#e9f9ee;color:#16833d}.badge.urgent{background:#fff4e5;color:#c45a00}.badge.critical{background:#ffe5e5;color:#c11d1d}.mini{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pill{background:#f1f4f3;padding:5px 8px;border-radius:7px;font-size:11px}.actions{display:flex;gap:6px;margin-top:9px}.actions button{flex:1;border:1px solid #dbe2e8;background:#fff;border-radius:9px;padding:8px;font-weight:700;color:#0f6e5c}.actions button:first-child{background:#0f6e5c;color:#fff}.panel{display:none;background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:14px;margin-top:10px}.panel.open{display:block}.back{border:0;background:none;color:#0f6e5c;font-weight:800;padding:0;margin-bottom:10px}.section{border-top:1px solid #e5eaed;padding-top:10px;margin-top:10px}.section h3{font-size:13px;margin:0 0 7px}.change{padding:8px;border-radius:9px;background:#fff8e8;margin:5px 0;font-size:12px}.danger{background:#fff0f0;color:#a51e1e}.timeline{border-left:2px solid #dbe2e8;padding-left:12px}.event{margin:0 0 12px}.event b{font-size:12px}.event p{margin:3px 0;font-size:12px;color:#566}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 12px}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:800;color:#667;margin-bottom:4px;text-transform:uppercase}.field textarea,.field input{width:100%;border:1px solid #ccd7dc;border-radius:9px;padding:10px;font:inherit}.preview{background:#f4f8f7;border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap}.sheet-actions{display:flex;gap:8px;margin-top:12px}.sheet-actions button{flex:1;padding:11px;border-radius:9px;border:1px solid #dbe2e8;font-weight:800}.sheet-actions .save{background:#0f6e5c;color:#fff;border-color:#0f6e5c}@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}.modal{align-items:center}.sheet{border-radius:18px}}</style></head><body><div class="top"><h1>🏥 Surgical Ward AI</h1><p>No-login prototype • fictional patients only</p></div><main class="wrap"><div id="dashboard"><div class="stats"><div class="stat"><b id="critical">1</b><small>CRITICAL</small></div><div class="stat"><b id="review">2</b><small>NEEDS REVIEW</small></div><div class="stat"><b id="stable">2</b><small>STABLE</small></div></div><div class="toolbar"><button onclick="newPatient()">＋ Add Patient</button><button class="secondary" onclick="resetDemo()">Reset Demo</button></div><div id="cards" class="cards"></div></div><div id="detail" class="panel"></div></main><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle">Add update</h2><div class="field"><label>Text update</label><textarea id="note" rows="5" placeholder="Example: Pulse 118, BP 98/62, urine output 20 mL/hr, abdomen more distended..."></textarea></div><div class="field"><label>Or upload a photo/report</label><input id="photo" type="file" accept="image/*,.pdf" onchange="photoSelected()"></div><div id="photoInfo" class="preview" style="display:none"></div><div class="field"><label>AI proposed update</label><div id="preview" class="preview">Enter a clinical update or select a report. The prototype will show the information that would be sent for AI extraction and verification.</div></div><div class="sheet-actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="confirmUpdate()">✓ Confirm & Update</button></div></div></div><script>const seed=[{id:1,bed:'FSW-05',name:'Patient A',age:52,sex:'M',diag:'Small bowel obstruction',status:'critical',v:'HR 118 ↑ • BP 98/62 ↓ • UO 20 ml/hr ↓',changes:['Tachycardia increased','Urine output falling','Abdominal distension increased'],events:['Admitted with abdominal pain and vomiting','CT: small bowel obstruction','Conservative management started']},{id:2,bed:'MSW-12',name:'Patient B',age:44,sex:'F',diag:'Acute appendicitis',status:'urgent',v:'HR 96 • BP 118/72 • T 37.8°C',changes:['Persistent pain'],events:['Admitted with RIF pain','USG supportive of appendicitis']},{id:3,bed:'FSW-09',name:'Patient C',age:61,sex:'F',diag:'Acute pancreatitis',status:'urgent',v:'HR 102 • BP 110/70 • T 38.1°C',changes:['Fever continues'],events:['Admitted with epigastric pain','Lipase elevated']},{id:4,bed:'MSW-03',name:'Patient D',age:36,sex:'M',diag:'Inguinal hernia',status:'stable',v:'HR 82 • BP 124/76',changes:[],events:['Elective surgical admission']},{id:5,bed:'SPECIAL-02',name:'Patient E',age:70,sex:'M',diag:'Post-op day 2',status:'stable',v:'HR 84 • BP 122/78 • UO adequate',changes:[],events:['Emergency laparotomy','POD 2 review: improving']}];let patients=JSON.parse(localStorage.getItem('wardDemoPatients')||'null')||seed;let selected=null;function save(){localStorage.setItem('wardDemoPatients',JSON.stringify(patients))}function render(){document.getElementById('cards').innerHTML=patients.map(p=>`<div class="card ${p.status}"><div class="row"><div><div class="muted">${p.bed}</div><div class="name">${p.name} • ${p.age}/${p.sex}</div></div><span class="badge ${p.status}">${p.status==='critical'?'🔴 CRITICAL':p.status==='urgent'?'🟠 NEEDS REVIEW':'🟢 STABLE'}</span></div><div class="diag">${p.diag}</div><div class="mini"><span class="pill">${p.v}</span>${p.changes.length?`<span class="pill">${p.changes.length} change(s)</span>`:''}</div><div class="actions"><button onclick="openPatient(${p.id})">Open Patient</button><button onclick="openUpdate(${p.id})">＋ Update</button></div></div>`).join('');document.getElementById('critical').textContent=patients.filter(p=>p.status==='critical').length;document.getElementById('review').textContent=patients.filter(p=>p.status==='urgent').length;document.getElementById('stable').textContent=patients.filter(p=>p.status==='stable').length}function openPatient(id){selected=patients.find(p=>p.id===id);document.getElementById('dashboard').style.display='none';let d=document.getElementById('detail');d.className='panel open';d.innerHTML=`<button class="back" onclick="closePatient()">← Back to Ward</button><div class="row"><div><div class="muted">${selected.bed}</div><h2 style="margin:2px 0">${selected.name}</h2><div class="muted">${selected.age} / ${selected.sex}</div></div><span class="badge ${selected.status}">${selected.status.toUpperCase()}</span></div><p><b>${selected.diag}</b></p><div class="section"><h3>🔴 CURRENT SITUATION</h3><div class="change ${selected.status==='critical'?'danger':''}">${selected.status==='critical'?'Clinical deterioration requires reassessment and appropriate senior escalation.':'Review current symptoms, examination, observations and pending investigations.'}</div></div><div class="section"><h3>📊 CURRENT OBSERVATIONS</h3><div class="mini"><span class="pill">${selected.v}</span></div></div><div class="section"><h3>⚠️ WHAT CHANGED</h3>${selected.changes.length?selected.changes.map(x=>`<div class="change">${x}</div>`).join(''):'<div class="change">No new changes recorded.</div>'}</div><div class="section"><h3>📋 TIMELINE</h3><div class="timeline">${selected.events.map((x,i)=>`<div class="event"><b>${i===0?'Admission':'Clinical update'}</b><p>${x}</p></div>`).join('')}</div></div><div class="actions"><button onclick="openUpdate(${selected.id})">📷 Add Photo / Text Update</button></div>`}function closePatient(){selected=null;document.getElementById('dashboard').style.display='block';document.getElementById('detail').className='panel'}function openUpdate(id){selected=patients.find(p=>p.id===id);document.getElementById('modal').className='modal open';document.getElementById('modalTitle').textContent='Update — '+selected.name;document.getElementById('note').value='';document.getElementById('photo').value='';document.getElementById('photoInfo').style.display='none';document.getElementById('preview').textContent='Enter a clinical update or select a report. AI extraction will be a proposed change requiring PG confirmation.'}function photoSelected(){let f=document.getElementById('photo').files[0];if(!f)return;document.getElementById('photoInfo').style.display='block';document.getElementById('photoInfo').textContent='Selected: '+f.name+' ('+Math.round(f.size/1024)+' KB)';document.getElementById('preview').textContent='PHOTO RECEIVED\n\nIn the production version, the vision model will extract clinical facts from this image, compare them with the patient record, highlight changes, and ask the PG to confirm before saving.'}document.getElementById('note').addEventListener('input',function(){let t=this.value.trim();if(t)document.getElementById('preview').textContent='PROPOSED AI UPDATE\n\n'+t+'\n\n→ Review extracted facts\n→ Compare with previous data\n→ PG confirmation required before saving.'});function confirmUpdate(){let t=document.getElementById('note').value.trim();let f=document.getElementById('photo').files[0];if(!t&&!f){alert('Enter an update or choose a photo/report.');return}let text=t||('Uploaded report: '+f.name);selected.events.push(text);if(t){if(/pulse\s*1[1-9]\d/i.test(t)||/tachy/i.test(t))selected.status='critical';selected.changes.unshift('New PG update added: '+t.slice(0,90))}save();closeModal();render();openPatient(selected.id);alert('Update confirmed in this prototype. Production AI extraction will verify extracted clinical facts before saving.')}function closeModal(){document.getElementById('modal').className='modal'}function newPatient(){let name=prompt('Patient name (demo only)');if(!name)return;patients.push({id:Date.now(),bed:'NEW',name,age:'',sex:'',diag:'New admission',status:'stable',v:'No observations yet',changes:['New admission — complete assessment'],events:['Patient created']});save();render()}function resetDemo(){if(confirm('Reset fictional demo patients?')){patients=JSON.parse(JSON.stringify(seed));save();render()}}render();</script></body></html>
