<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Surgical Ward Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0b6655;--gd:#084c40;--bg:#f4f7f6;--card:#fff;--line:#dce5e2;--ink:#17302b;--muted:#65736f;--red:#c62828;--orange:#e76f00;--yellow:#a87900;--green:#198754}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--gd);color:white;padding:12px 14px;box-shadow:0 2px 8px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:800;font-size:18px}.sub{font-size:12px;opacity:.8}.wrap{max-width:1100px;margin:auto;padding:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:7px;margin:10px 0;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:130px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:700}.btn.secondary{background:#e8efed;color:var(--gd)}.btn.danger{background:#fff0f0;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}.patient{background:#fff;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:13px;padding:11px}.patient.critical{border-left-color:var(--red)}.patient.urgent{border-left-color:var(--orange)}.patient.moderate{border-left-color:var(--yellow)}.phead{display:flex;justify-content:space-between;gap:8px}.bed{font-size:11px;color:var(--muted);font-weight:800}.name{font-weight:800;font-size:17px}.dx{font-size:13px;margin-top:5px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;background:#edf3f1;padding:4px 7px;border-radius:7px}.status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:7px;background:#e8f7ee;color:var(--green)}.status.critical{background:#ffe8e8;color:var(--red)}.status.urgent{background:#fff0df;color:var(--orange)}.status.moderate{background:#fff7df;color:var(--yellow)}.pfoot{display:flex;gap:5px;margin-top:10px}.pfoot button{flex:1;padding:8px;border:0;border-radius:8px;background:#edf3f1;color:var(--gd);font-weight:700}.empty{text-align:center;color:var(--muted);padding:35px}.overlay{display:none;position:fixed;inset:0;background:#10231fcc;z-index:50;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.modal{background:#fff;width:100%;max-width:650px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:15px}.modal h2{margin:0 0 10px;font-size:19px}.field{margin:8px 0}.field label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;margin-top:12px}.actions>*{flex:1}.section{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}.section h3{font-size:13px;margin:0 0 7px}.timeline{display:flex;flex-direction:column;gap:7px}.event{border-left:3px solid var(--g);padding:7px 9px;background:#f7faf9;border-radius:0 8px 8px 0;font-size:12px}.event small{color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{background:#fff;width:min(420px,100%);padding:22px;border-radius:18px;box-shadow:0 10px 35px #0002}.hidden{display:none!important}.proposed{background:#fffaf0;border:1px solid #f1d58a;border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17302b;color:#fff;padding:10px 14px;border-radius:10px;z-index:100;font-size:13px;display:none}.loading{opacity:.6;pointer-events:none}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>🏥 Surgical Ward Manager</h1><p class="sub">Supabase clinical ward system</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="doctor@hospital"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn" style="width:100%" id="loginBtn">Sign in</button><p id="loginErr" style="color:#b42318;font-size:12px"></p></div></div>
<div id="app" class="hidden"><div class="top"><div class="toprow"><div><div class="title">🏥 Surgical Ward Manager</div><div class="sub" id="userLabel"></div></div><button class="btn secondary" id="logout">Logout</button></div></div><main class="wrap"><div class="stats"><div class="stat"><b id="total">0</b><span>Patients</span></div><div class="stat"><b id="critical">0</b><span>Critical</span></div><div class="stat"><b id="review">0</b><span>Needs review</span></div><div class="stat"><b id="stable">0</b><span>Stable</span></div></div><div class="toolbar"><input id="search" placeholder="Search patient / UHID / bed / diagnosis"><select id="wardFilter"><option value="">All wards</option><option>FSW</option><option>MSW</option><option>SPECIAL</option></select><button class="btn" id="addPatient">+ Patient</button></div><div id="grid" class="grid"></div></main></div>
<div id="patientModal" class="overlay"><div class="modal"><h2 id="modalTitle">Patient</h2><div id="patientBody"></div><div class="actions"><button class="btn secondary" id="closePatient">Close</button><button class="btn" id="addUpdate">+ Add update</button></div></div></div>
<div id="updateModal" class="overlay"><div class="modal"><h2>Add clinical update</h2><p id="updatePatient" class="sub"></p><div class="field"><label>Text update</label><textarea id="updateText" rows="5" placeholder="Example: Pulse 112, BP 98/60, abdomen more distended, urine output 20 mL/hr"></textarea></div><div class="field"><label>Photo / report</label><input id="photo" type="file" accept="image/*,application/pdf"></div><p class="sub">The AI will extract a proposed update. Clinical facts must be verified before they are added to the structured record.</p><div id="proposal" class="proposed hidden"></div><div class="actions"><button class="btn secondary" id="cancelUpdate">Cancel</button><button class="btn" id="extractBtn">Extract with AI</button><button class="btn hidden" id="confirmBtn">Confirm & save</button></div></div></div>
<div id="newModal" class="overlay"><div class="modal"><h2>New ward patient</h2><div class="row"><div class="field"><label>Name</label><input id="nName"></div><div class="field"><label>Age</label><input id="nAge" type="number"></div></div><div class="row"><div class="field"><label>Sex</label><select id="nSex"><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>UHID / Hospital No</label><input id="nUHID"></div></div><div class="row"><div class="field"><label>Ward</label><select id="nWard"><option>FSW</option><option>MSW</option><option>SPECIAL</option></select></div><div class="field"><label>Bed</label><input id="nBed"></div></div><div class="row"><div class="field"><label>Unit</label><input id="nUnit" placeholder="S-1 to S-6"></div><div class="field"><label>Priority</label><select id="nPriority"><option>Medium</option><option>High</option><option>Emergency</option><option>Low</option></select></div></div><div class="field"><label>Diagnosis</label><input id="nDx"></div><div class="actions"><button class="btn secondary" id="cancelNew">Cancel</button><button class="btn" id="saveNew">Save patient</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://pnncnljakqrqzocahxhs.supabase.co';
const SUPABASE_KEY='sb_publishable_cga5rEYY_gFG3KZ2Kpvb9g_ZoHKiYJd';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let patients=[],currentPatient=null,currentExtract=null,currentDocId=null;
const $=id=>document.getElementById(id);
function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function statusClass(p){let x=(p.priority||'').toLowerCase();if(x.includes('emergency')||x.includes('critical'))return'critical';if(x.includes('high')||x.includes('urgent'))return'urgent';if(x.includes('medium'))return'moderate';return''}
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
async function loadPatients(){const {data,error}=await sb.from('patients').select('*').order('ward').order('bed');if(error){toast(error.message);return}patients=data||[];render()}
function render(){let q=$('search').value.toLowerCase(),w=$('wardFilter').value;let ps=patients.filter(p=>(!w||p.ward===w)&&(!q||[p.name,p.hospital_no,p.ip_no,p.op_no,p.bed,p.diagnosis].join(' ').toLowerCase().includes(q)));$('total').textContent=patients.length;$('critical').textContent=patients.filter(p=>statusClass(p)==='critical').length;$('review').textContent=patients.filter(p=>['critical','urgent','moderate'].includes(statusClass(p))).length;$('stable').textContent=patients.filter(p=>!statusClass(p)).length;$('grid').innerHTML=ps.length?ps.map(p=>`<div class="patient ${statusClass(p)}"><div class="phead"><div><div class="bed">${esc(p.ward||'Ward')} · ${esc(p.bed||'No bed')}</div><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.age||'')} ${esc(p.sex||'')} · ${esc(p.hospital_no||p.ip_no||'')}</div></div><span class="status ${statusClass(p)}">${esc(p.priority||'Medium')}</span></div><div class="dx"><b>${esc(p.diagnosis||'Diagnosis not entered')}</b></div><div class="chips">${p.unit?`<span class="chip">${esc(p.unit)}</span>`:''}<span class="chip">${esc(p.current_status||'Admitted')}</span></div><div class="pfoot"><button onclick="openPatient('${p.id}')">Open patient</button><button onclick="quickUpdate('${p.id}')">📷 / ✍️ Update</button></div></div>`).join(''):'<div class="empty">No ward patients found.</div>'}
async function openPatient(id){currentPatient=patients.find(p=>p.id===id);if(!currentPatient)return; $('modalTitle').textContent=`${currentPatient.name} · ${currentPatient.bed||'No bed'}`; $('patientModal').classList.add('open'); await renderPatientDetail()}
async function renderPatientDetail(){let p=currentPatient;let [ev,obs,inv,med]=await Promise.all([sb.from('ward_patient_events').select('*').eq('patient_id',p.id).order('created_at',{ascending:false}).limit(30),sb.from('ward_observations').select('*').eq('patient_id',p.id).order('observed_at',{ascending:false}).limit(10),sb.from('ward_investigation_results').select('*').eq('patient_id',p.id).order('created_at',{ascending:false}).limit(20),sb.from('ward_medications').select('*').eq('patient_id',p.id).eq('status','active').order('created_at',{ascending:false})]);let v=(obs.data||[])[0];let html=`<div class="chips"><span class="chip">${esc(p.ward||'')}</span><span class="chip">Bed ${esc(p.bed||'')}</span><span class="chip">UHID ${esc(p.hospital_no||'')}</span></div><div class="section"><h3>Current situation</h3><p>${esc(p.diagnosis||'No diagnosis entered')}</p><p class="sub">Status: ${esc(p.current_status||'Admitted')} · Priority: ${esc(p.priority||'Medium')}</p></div>`;if(v)html+=`<div class="section"><h3>Latest vitals</h3><div class="chips"><span class="chip">HR ${esc(v.heart_rate||'-')}</span><span class="chip">BP ${esc(v.systolic_bp||'-')}/${esc(v.diastolic_bp||'-')}</span><span class="chip">Temp ${esc(v.temperature_c||'-')}</span><span class="chip">SpO₂ ${esc(v.spo2||'-')}</span><span class="chip">UO ${esc(v.urine_output_ml_hr||'-')} mL/hr</span><span class="chip">Pain ${esc(v.pain_score||'-')}</span></div></div>`;if((inv.data||[]).length)html+=`<div class="section"><h3>Recent investigations</h3>${inv.data.slice(0,8).map(x=>`<div class="event"><b>${esc(x.test_name)}</b>: ${esc(x.value_text||x.value_numeric||'')}</div>`).join('')}</div>`;if((med.data||[]).length)html+=`<div class="section"><h3>Active medications</h3>${med.data.map(x=>`<div class="event"><b>${esc(x.medication_name)}</b> ${esc(x.dose||'')} ${esc(x.route||'')} ${esc(x.frequency||'')}</div>`).join('')}</div>`;html+=`<div class="section"><h3>Timeline</h3><div class="timeline">${(ev.data||[]).map(x=>`<div class="event"><b>${esc(x.title)}</b><br>${esc(x.detail||'')}<br><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join('')||'<div class="sub">No events yet.</div>'}</div></div>`;$('patientBody').innerHTML=html}
function quickUpdate(id){currentPatient=patients.find(p=>p.id===id);$('updatePatient').textContent=`${currentPatient.name} · ${currentPatient.ward||''} · Bed ${currentPatient.bed||''}`;$('updateText').value='';$('photo').value='';$('proposal').classList.add('hidden');$('confirmBtn').classList.add('hidden');$('extractBtn').classList.remove('hidden');currentExtract=null;currentDocId=null;$('updateModal').classList.add('open')}
$('addUpdate').onclick=()=>{if(currentPatient)quickUpdate(currentPatient.id);$('patientModal').classList.remove('open')};$('closePatient').onclick=()=>$('patientModal').classList.remove('open');$('cancelUpdate').onclick=()=>$('updateModal').classList.remove('open');$('addPatient').onclick=()=>$('newModal').classList.add('open');$('cancelNew').onclick=()=>$('newModal').classList.remove('open');$('search').oninput=render;$('wardFilter').onchange=render;
$('saveNew').onclick=async()=>{let btn=$('saveNew');btn.disabled=true;let u=sb.auth.getUser();let {data:{user}}=await u;let payload={name:$('nName').value.trim(),age:Number($('nAge').value)||null,sex:$('nSex').value,hospital_no:$('nUHID').value.trim()||null,ward:$('nWard').value,bed:$('nBed').value.trim()||null,unit:$('nUnit').value.trim()||null,priority:$('nPriority').value,diagnosis:$('nDx').value.trim()||null,current_status:'Admitted'};let {data,error}=await sb.from('patients').insert(payload).select().single();btn.disabled=false;if(error){toast(error.message);return}await sb.from('ward_patient_events').insert({patient_id:data.id,event_type:'admission',title:'Patient admitted to ward',detail:`${data.ward||''} ${data.bed||''} · ${data.diagnosis||''}`,actor_id:user?.id||null,source:'manual'});$('newModal').classList.remove('open');toast('Patient added');loadPatients()};
$('extractBtn').onclick=async()=>{let text=$('updateText').value.trim(),file=$('photo').files[0];if(!text&&!file){toast('Enter text or select a photo/report');return}let btn=$('extractBtn');btn.disabled=true;try{let docId=null,imageUrl=null;if(file){let path=`${currentPatient.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let up=await sb.storage.from('ward-documents').upload(path,file,{upsert:false});if(up.error)throw up.error;let signed=await sb.storage.from('ward-documents').createSignedUrl(path,300);if(signed.error)throw signed.error;imageUrl=signed.data.signedUrl;let d=await sb.from('ward_documents').insert({patient_id:currentPatient.id,file_name:file.name,storage_path:path,mime_type:file.type,status:'Uploaded'}).select().single();if(d.error)throw d.error;docId=d.data.id;currentDocId=docId}let {data:{session}}=await sb.auth.getSession();let r=await fetch(SUPABASE_URL+'/functions/v1/ward-ai-extract',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({patient_id:currentPatient.id,document_id:docId,text:text||undefined,image_url:imageUrl||undefined})});let j=await r.json();if(!r.ok)throw new Error(j.error||'AI extraction failed');currentExtract=j.extracted;$('proposal').textContent=JSON.stringify(j.extracted,null,2);$('proposal').classList.remove('hidden');$('confirmBtn').classList.remove('hidden');$('extractBtn').classList.add('hidden')}catch(e){toast(e.message)}finally{btn.disabled=false}};
$('confirmBtn').onclick=async()=>{if(!currentExtract||!currentPatient)return;let btn=$('confirmBtn');btn.disabled=true;try{let {data:{user}}=await sb.auth.getUser();let e=currentExtract;let vit=(e.vitals||[]).at(-1)||e.vitals?.[0];if(vit){let v=vit.values||vit;await sb.from('ward_observations').insert({patient_id:currentPatient.id,observed_at:new Date().toISOString(),temperature_c:Number(v.temperature_c||v.temperature)||null,heart_rate:Number(v.heart_rate||v.pulse)||null,systolic_bp:Number(v.systolic_bp)||null,diastolic_bp:Number(v.diastolic_bp)||null,respiratory_rate:Number(v.respiratory_rate)||null,spo2:Number(v.spo2)||null,urine_output_ml_hr:Number(v.urine_output_ml_hr)||null,pain_score:Number(v.pain_score)||null,mental_status:v.mental_status||null,source:currentDocId?'photo_ai':'text_ai',source_document_id:currentDocId,raw_text:$('updateText').value,verified:true,verified_by:user?.id||null,verified_at:new Date().toISOString(),created_by:user?.id||null});let pv={...(currentPatient.vitals||{}),...v};await sb.from('patients').update({vitals:pv,updated_at:new Date().toISOString()}).eq('id',currentPatient.id)}for(const x of (e.investigations||[])){let name=x.test_name||x.name;if(!name)continue;await sb.from('ward_investigation_results').insert({patient_id:currentPatient.id,investigation_type:x.investigation_type||'Other',test_name:name,value_text:String(x.value_text??x.value??''),value_numeric:Number(x.value_numeric)||null,unit:x.unit||null,reference_range:x.reference_range||null,result_status:x.result_status||null,source:currentDocId?'photo_ai':'text_ai',source_document_id:currentDocId,raw_text:$('updateText').value,verified:true,verified_by:user?.id||null,verified_at:new Date().toISOString(),created_by:user?.id||null})}if(e.summary||$('updateText').value){await sb.from('ward_patient_events').insert({patient_id:currentPatient.id,event_type:'clinical_update',title:'Verified clinical update',detail:e.summary||$('updateText').value,actor_id:user?.id||null,source:currentDocId?'photo_ai':'text'})}if(currentDocId)await sb.from('ward_documents').update({status:'verified',verified_by:user?.id||null,verified_at:new Date().toISOString()}).eq('id',currentDocId);toast('Verified update saved');$('updateModal').classList.remove('open');await loadPatients();currentPatient=patients.find(p=>p.id===currentPatient.id);if(currentPatient){$('patientModal').classList.add('open');await renderPatientDetail()}}catch(e){toast(e.message)}finally{btn.disabled=false}};
$('logout').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_event,session)=>{if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=session.user.email;loadPatients()}else{$('app').classList.add('hidden');$('login').classList.remove('hidden')}});
$('loginBtn').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginErr').textContent=error?error.message:''};
</script></body></html>
